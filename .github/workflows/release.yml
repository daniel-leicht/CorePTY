name: Build & Release

# Cut a release by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
# Alternatively, run it from the Actions tab. On a manual run you may supply a tag to
# publish a release; leave it blank to just build the downloadable artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish a release for (e.g. v0.1.0). Blank = build artifacts only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the app on each OS and stage its artifacts with consistent names.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri's Linux (WebKitGTK) build + AppImage bundler need these.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            file \
            wget \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate project versions and release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const tauri = readJson("src-tauri/tauri.conf.json");
          const packageSection = cargo.match(/\[package\]([\s\S]*?)(?:\n\[|$)/)?.[1];
          const cargoVersion = packageSection?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = {
            package: readJson("package.json").version,
            tauri: tauri.version,
            cargo: cargoVersion,
          };
          const expected = versions.package;
          if (!expected || Object.values(versions).some((value) => value !== expected)) {
            throw new Error(`Project versions do not match: ${JSON.stringify(versions)}`);
          }
          const tag = process.env.RELEASE_TAG;
          if (tag && tag !== `v${expected}`) {
            throw new Error(`Release tag ${tag} does not match project version v${expected}`);
          }
          const nsis = tauri.bundle?.windows?.nsis;
          if (
            nsis?.installMode !== "currentUser" ||
            nsis?.template !== "windows/installer.nsi"
          ) {
            throw new Error("NSIS must use the CorePTY current-user installer template");
          }
          const installer = fs
            .readFileSync(`src-tauri/${nsis.template}`, "utf8")
            .replace(/\r\n/g, "\n");
          const inPlaceUpgrade = [
            '${If} $WixMode <> 1',
            '      StrCpy $UpdateMode 1',
            '      Abort',
          ].join("\n");
          if (!installer.includes(inPlaceUpgrade)) {
            throw new Error("NSIS template no longer enables in-place upgrades");
          }
          console.log(`Validated CorePTY ${expected}${tag ? ` (${tag})` : ""}`);
          NODE

      - name: Check frontend
        run: npm run check

      - name: Test native core
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage release artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          rel="src-tauri/target/${{ matrix.target }}/release"
          out="release-artifacts"; mkdir -p "$out"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          case "${{ matrix.platform }}" in
            windows)
              # NSIS installer + the self-contained portable exe (web UI embedded).
              cp "$(ls "$rel"/bundle/nsis/*-setup.exe | head -n1)" "$out/CorePTY_${ver}_x64-setup.exe"
              cp "$rel/corepty.exe" "$out/CorePTY_${ver}_x64-portable.exe"
              ;;
            macos)
              # Universal .dmg (Intel + Apple Silicon).
              cp "$(ls "$rel"/bundle/dmg/*.dmg | head -n1)" "$out/CorePTY_${ver}_universal.dmg"
              ;;
            linux)
              # Portable AppImage + a Debian package.
              cp "$(ls "$rel"/bundle/appimage/*.AppImage | head -n1)" "$out/CorePTY_${ver}_amd64.AppImage"
              cp "$(ls "$rel"/bundle/deb/*.deb | head -n1)" "$out/CorePTY_${ver}_amd64.deb"
              ;;
          esac

          echo "Staged artifacts:"; ls -la "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: corepty-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect every OS's artifacts and publish a single, cross-platform release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag + version
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -n "${tag}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        if: steps.rel.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        if: steps.rel.outputs.publish == 'true'
        run: ls -la dist

      - name: Publish to GitHub Releases
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.rel.outputs.tag }}
          name: CorePTY ${{ steps.rel.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ## CorePTY ${{ steps.rel.outputs.tag }}

            | Platform | Download | Notes |
            |---|---|---|
            | Windows 10/11 x64 | `CorePTY_${{ steps.rel.outputs.version }}_x64-setup.exe` | NSIS installer; upgrades an existing per-user installation in place. |
            | Windows x64 portable | `CorePTY_${{ steps.rel.outputs.version }}_x64-portable.exe` | Standalone executable; requires the Edge WebView2 runtime. |
            | macOS universal | `CorePTY_${{ steps.rel.outputs.version }}_universal.dmg` | Supports Intel and Apple Silicon. |
            | Linux x86-64 | `CorePTY_${{ steps.rel.outputs.version }}_amd64.AppImage` | Portable AppImage; run `chmod +x` before launching. |
            | Debian or Ubuntu x86-64 | `CorePTY_${{ steps.rel.outputs.version }}_amd64.deb` | Install with `sudo apt install ./CorePTY_${{ steps.rel.outputs.version }}_amd64.deb`. |

            Release artifacts are unsigned. See the project README for build
            instructions, security details, and supported features.
